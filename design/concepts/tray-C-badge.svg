<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- Mic, shifted slightly up-left to leave clean space for the badge -->
  <rect x="5" y="2" width="4" height="7" rx="2" fill="black"/>
  <path d="M 2.6 6.5 A 4.4 4.4 0 0 0 11.4 6.5" stroke="black" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M 7 11 L 7 13"         stroke="black" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 4.5 13.6 L 9.5 13.6" stroke="black" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Padlock badge: solid body with a cut-out shackle hint (evenodd for a real hole) -->
  <g>
    <!-- Body with keyhole hole -->
    <path fill-rule="evenodd" d="
      M 12.3 14 h 5 a 0.5 0.5 0 0 1 0.5 0.5 v 2.8 a 0.5 0.5 0 0 1 -0.5 0.5 h -5 a 0.5 0.5 0 0 1 -0.5 -0.5 v -2.8 a 0.5 0.5 0 0 1 0.5 -0.5 z
      M 14.8 15.0 a 0.55 0.55 0 1 0 0 1.1 a 0.55 0.55 0 1 0 0 -1.1 z
    "/>
    <!-- Shackle -->
    <path d="M 13.1 14 V 12.9 A 1.7 1.7 0 0 1 16.5 12.9 V 14" stroke="black" stroke-width="0.7" fill="none" stroke-linecap="round"/>
  </g>
</svg>
